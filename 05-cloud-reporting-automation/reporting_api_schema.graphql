# Illustrative API contract for the portfolio sample.
# Included to show how curated reporting metrics could be exposed to a UI.

type RegionMetric {
  region: String!
  revenue: Float!
}

type Metrics {
  report_date: String!
  total_amount: Float!
  order_count: Int!
  avg_order_value: Float!
  revenue_by_region: [RegionMetric!]!
}

type Query {
  dailyMetrics(date: String): Metrics
}
